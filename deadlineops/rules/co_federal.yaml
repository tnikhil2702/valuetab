jurisdiction: CO_FEDERAL
name: "Colorado Federal Court (D. Colo.)"
day_type_default: calendar
holiday_set: federal

rules:
  # ── SERVICE OF COMPLAINT ──────────────────────────────────────────────────
  - id: co_fed_answer
    trigger: service_of_complaint
    label: "Answer to Complaint Due"
    offset_days: 21
    day_type: calendar
    rollover: next_business_day
    reminders_days: [14, 7, 3, 1]
    color: red
    notes: "FRCP 12(a)(1)(A)(i)"

  - id: co_fed_answer_usa
    trigger: service_of_complaint
    label: "Answer Due — United States as Defendant"
    offset_days: 60
    day_type: calendar
    rollover: next_business_day
    reminders_days: [30, 14, 7, 3, 1]
    color: red
    notes: "FRCP 12(a)(2)"

  # ── STATUTE OF LIMITATIONS ────────────────────────────────────────────────
  - id: co_fed_sol_federal_civil_rights
    trigger: incident_date
    label: "SOL — Federal Civil Rights / § 1983 (2 yr)"
    # offset_days: 730
    offset_years: 2
    day_type: calendar
    rollover: next_business_day
    reminders_days: [365, 180, 90, 30, 14, 7, 3, 1]
    color: red
    notes: "42 U.S.C. § 1983 — borrows CO 2-year personal injury SOL"

  - id: co_fed_sol_title_vii
    trigger: eeoc_right_to_sue_date
    label: "SOL — Title VII / ADA / ADEA Suit Filing (90 days)"
    offset_days: 90
    day_type: calendar
    rollover: next_business_day
    reminders_days: [60, 30, 14, 7, 3, 1]
    color: red
    notes: "42 U.S.C. § 2000e-5(f)(1) — 90 days from right-to-sue letter"

  # ── DISCOVERY ─────────────────────────────────────────────────────────────
  - id: co_fed_rule26_conference
    trigger: defendant_appeared_date
    label: "Rule 26(f) Conference Must Occur By"
    offset_days: 21
    day_type: calendar
    rollover: next_business_day
    reminders_days: [14, 7, 3]
    color: orange
    notes: "FRCP 26(f) — as soon as practicable, at least 21 days before scheduling conference"

  - id: co_fed_initial_disclosures
    trigger: rule26f_conference_date
    label: "Initial Disclosures Due (FRCP 26(a)(1))"
    offset_days: 14
    day_type: calendar
    rollover: next_business_day
    reminders_days: [7, 3, 1]
    color: orange
    notes: "FRCP 26(a)(1) — 14 days after Rule 26(f) conference"

  - id: co_fed_scheduling_order
    trigger: defendant_appeared_date
    label: "Scheduling Order / Rule 16 Conference"
    offset_days: 70
    day_type: calendar
    rollover: next_business_day
    reminders_days: [21, 14, 7]
    color: orange
    notes: "FRCP 16(b)(2) — within 70 days after defendant appears (D. Colo. local)"

  - id: co_fed_discovery_cutoff
    trigger: trial_date
    label: "Discovery Cutoff"
    offset_days: -60
    day_type: calendar
    rollover: previous_business_day
    reminders_days: [30, 14, 7]
    color: orange
    notes: "D. Colo. Local Rule — typically 60 days before trial per scheduling order"

  - id: co_fed_expert_disclosure_plaintiff
    trigger: discovery_cutoff_date
    label: "Plaintiff Expert Disclosures Due (FRCP 26(a)(2))"
    offset_days: -60
    day_type: calendar
    rollover: previous_business_day
    reminders_days: [30, 14, 7, 3]
    color: orange
    notes: "FRCP 26(a)(2)(D) — 90 days before trial; often 60 days before cutoff per CMO. Written report required for retained experts."

  - id: co_fed_expert_disclosure_defendant
    trigger: expert_disclosure_plaintiff_date
    label: "Defendant Expert Disclosures Due"
    offset_days: 30
    day_type: calendar
    rollover: next_business_day
    reminders_days: [14, 7, 3, 1]
    color: orange
    notes: "FRCP 26(a)(2)(D) — 30 days after plaintiff's expert disclosure"

  - id: co_fed_rebuttal_expert
    trigger: defendant_expert_disclosure_date
    label: "Rebuttal Expert Disclosure Deadline"
    offset_days: 30
    day_type: calendar
    rollover: next_business_day
    reminders_days: [14, 7, 3]
    color: orange
    notes: "FRCP 26(a)(2)(D). Trigger = defendant_expert_disclosure_date + 30 days (chained trigger — NOT trial_date). If defendant date unknown, use trial−60 as provisional estimate with warning."

  # ── MOTION DEADLINES ──────────────────────────────────────────────────────
  - id: co_fed_msj
    trigger: discovery_cutoff_date
    label: "Motion for Summary Judgment Deadline"
    offset_days: 21
    day_type: calendar
    rollover: next_business_day
    reminders_days: [14, 7, 3, 1]
    color: yellow
    notes: "D. Colo. Local Rule 56.1 — typically 21 days after discovery cutoff"

  - id: co_fed_msj_response
    trigger: msj_filed_date
    label: "Response to Motion for Summary Judgment"
    offset_days: 21
    day_type: calendar
    rollover: next_business_day
    reminders_days: [14, 7, 3, 1]
    color: yellow
    notes: "D. Colo. Local Rule 7.1(d)(1)"

  - id: co_fed_msj_reply
    trigger: msj_response_date
    label: "Reply ISO Motion for Summary Judgment"
    offset_days: 14
    day_type: calendar
    rollover: next_business_day
    reminders_days: [7, 3, 1]
    color: yellow
    notes: "D. Colo. Local Rule 7.1(d)(2)"

  - id: co_fed_motion_response
    trigger: motion_filed_date
    label: "Response to Motion Due"
    offset_days: 21
    day_type: calendar
    rollover: next_business_day
    reminders_days: [14, 7, 3, 1]
    color: yellow
    notes: "D. Colo. Local Rule 7.1(d)(1)"

  - id: co_fed_motion_reply
    trigger: motion_response_date
    label: "Reply in Support of Motion Due"
    offset_days: 14
    day_type: calendar
    rollover: next_business_day
    reminders_days: [7, 3, 1]
    color: yellow
    notes: "D. Colo. Local Rule 7.1(d)(2)"

  # ── TRIAL SCHEDULING ──────────────────────────────────────────────────────
  - id: co_fed_final_pretrial_order
    trigger: trial_date
    label: "Final Pre-Trial Order Due"
    offset_days: -14
    day_type: calendar
    rollover: previous_business_day
    reminders_days: [14, 7, 3, 1]
    color: blue
    notes: "D. Colo. Local Rule 16.3"

  - id: co_fed_motions_in_limine
    trigger: trial_date
    label: "Motions in Limine Deadline"
    offset_days: -28
    day_type: calendar
    rollover: previous_business_day
    reminders_days: [14, 7, 3, 1]
    color: blue
    notes: "D. Colo. — typically 28 days before trial per scheduling order"

  - id: co_fed_jury_instructions
    trigger: trial_date
    label: "Proposed Jury Instructions Due"
    offset_days: -7
    day_type: calendar
    rollover: previous_business_day
    reminders_days: [7, 3, 1]
    color: blue
    notes: "D. Colo. Local Rule 51.1"

  - id: co_fed_exhibit_list
    trigger: trial_date
    label: "Final Exhibit & Witness List Due"
    offset_days: -7
    day_type: calendar
    rollover: previous_business_day
    reminders_days: [7, 3, 1]
    color: blue
    notes: "D. Colo. Local Rule 16.3"

  # ── POST-TRIAL ────────────────────────────────────────────────────────────
  - id: co_fed_motion_new_trial
    trigger: judgment_entry_date
    label: "Motion for New Trial / Alter or Amend Judgment"
    offset_days: 28
    day_type: calendar
    rollover: next_business_day
    reminders_days: [14, 7, 3, 1]
    color: red
    notes: "FRCP 59(b) / 59(e) — 28 days from entry of judgment."

  - id: co_fed_notice_of_appeal
    trigger: judgment_entry_date
    label: "Notice of Appeal"
    offset_days: 30
    day_type: calendar
    rollover: next_business_day
    reminders_days: [14, 7, 3, 1]
    color: red
    notes: "FRAP 4(a)(1)(A) — 30 days from entry of judgment. JURISDICTIONAL — cannot extend."

  # ── COMPLAINT FILED DATE ANCHORS ─────────────────────────────────────────
  - id: co_fed_filing_rule26f_conference
    trigger: complaint_filed_date
    label: "Rule 26(f) Conference Deadline (Filing Anchor)"
    offset_days: 21
    day_type: calendar
    rollover: next_business_day
    reminders_days: [14, 7, 1]
    color: orange
    cmo_override: "No – Statutory"
    risk_level: NEAR-ABSOLUTE
    jurisdiction_scope: CO + FEDERAL
    notes: "FRCP 26(f) — parties must hold Rule 26(f) conference within 21 days of complaint filed date. Anchored to complaint_filed_date (not defendant_appeared_date). CO Federal."

  - id: co_fed_filing_initial_disclosures
    trigger: complaint_filed_date
    label: "Initial Disclosures Due — Filing Anchor (Rule 26(a)(1))"
    offset_days: 35
    day_type: calendar
    rollover: next_business_day
    reminders_days: [14, 7, 1]
    color: blue
    cmo_override: "Yes – CMO sets date"
    risk_level: NEAR-ABSOLUTE
    jurisdiction_scope: CO + FEDERAL
    notes: "FRCP 26(a)(1) — initial disclosures due 14 days after Rule 26(f) conference (21 + 14 = 35 days from complaint filed date). Anchored to complaint_filed_date. CO Federal."

  - id: co_fed_filing_scheduling_order
    trigger: complaint_filed_date
    label: "Scheduling Order Deadline — Filing Anchor"
    offset_days: 90
    day_type: calendar
    rollover: next_business_day
    reminders_days: [21, 14, 7, 1]
    color: orange
    cmo_override: "Yes – CMO sets date"
    risk_level: CMO-ADJUSTABLE
    jurisdiction_scope: CO + FEDERAL
    notes: "FRCP 16(b)(2); D. Colo. Local Rule — scheduling order deadline anchored to complaint filed date. CO Federal."